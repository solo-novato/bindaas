name: Bug report
description: Something isn't working as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project…
        2. …
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste from **Settings → About → Copy diagnostics** (versions and connection state only — no files or conversations).
      render: json
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
