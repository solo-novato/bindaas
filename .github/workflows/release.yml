name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    name: Apple silicon DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tag matches the app version
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match package.json $version"; exit 1; }
      - run: npm ci
      - run: npm run notices && git diff --exit-code THIRD_PARTY_NOTICES.md
      # Ad-hoc signed (signingIdentity "-"), not notarized. See docs/INSTALL.md.
      - run: npm run dist:mac
      - name: Checksums
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          shasum -a 256 *.dmg | tee SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/SHA256SUMS.txt
          body: |
            **Install:** open the DMG, drag Bindaas to Applications, then run
            `xattr -dr com.apple.quarantine /Applications/Bindaas.app` once (the app is not notarized).
            Requires an Apple silicon Mac (macOS 13.1+) and the Codex CLI 0.154.0+ or Claude Code 2.1.274+. See docs/INSTALL.md.
